<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カウントアプリ</title>
</head>
<body>

  <h1>ボタンを押して数を増やそう</h1>

  <!-- サーバーとの通信チェック -->
  <p id="server-message">サーバーと通信中...</p>

  <script src="app.js"></script>
</body>
</html>
